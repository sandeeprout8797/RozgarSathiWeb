<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carousel with Prev/Next/Jump</title>
<style>
  body {
    font-family: Arial, sans-serif;
    padding: 20px;
  }

  .controls {
    margin-bottom: 15px;
  }

  button {
    padding: 8px 12px;
    margin-right: 8px;
    font-size: 16px;
  }

  input[type="number"] {
    width: 80px;
    padding: 6px;
    font-size: 16px;
    margin-right: 8px;
  }

  .box {
    display: none;
    height: 120px;
    background: #4caf50;
    color: white;
    font-size: 36px;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 8px;
    margin-bottom: 10px;
  }

  .status {
    font-size: 18px;
    margin-top: 8px;
  }
</style>
</head>
<body>

<div class="controls">
  <button id="prevBtn">Previous</button>
  <button id="nextBtn">Next</button>

  <input type="number" id="jumpInput" placeholder="#">
  <button id="jumpBtn">Go</button>
</div>

<div id="boxes">
  <div class="box">1</div>
  <div class="box">2</div>
  <div class="box">3</div>
  <div class="box">4</div>
  <div class="box">5</div>
  <div class="box">6</div>
</div>

<div class="status" id="statusLabel"></div>

<script>
  const boxes = document.querySelectorAll('.box');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const jumpInput = document.getElementById('jumpInput');
  const jumpBtn = document.getElementById('jumpBtn');
  const statusLabel = document.getElementById('statusLabel');

  let currentIndex = 0;

  function showBox(index) {
    boxes.forEach((b, i) => {
      b.style.display = i === index ? 'flex' : 'none';
    });

    // update buttons
    prevBtn.disabled = index === 0;
    nextBtn.disabled = index === boxes.length - 1;

    // status text
    statusLabel.textContent = `Showing ${index + 1} of ${boxes.length}`;
  }

  prevBtn.addEventListener('click', () => {
    if (currentIndex > 0) {
      currentIndex--;
      showBox(currentIndex);
    }
  });

  nextBtn.addEventListener('click', () => {
    if (currentIndex < boxes.length - 1) {
      currentIndex++;
      showBox(currentIndex);
    }
  });

  jumpBtn.addEventListener('click', () => {
    const value = parseInt(jumpInput.value, 10);

    if (!isNaN(value) && value >= 1 && value <= boxes.length) {
      currentIndex = value - 1;
      showBox(currentIndex);
    } else {
      alert(`Enter a valid number between 1 and ${boxes.length}`);
    }
  });

  // initially show the first box
  showBox(currentIndex);
</script>

</body>
</html>
