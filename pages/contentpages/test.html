<!DOCTYPE html>
<html>
<head>
  <title>Show One Child Div at a Time</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 40px;
    }

    #parent {
      width: 400px;
      height: 200px;
      margin: 20px auto;
      border: 2px solid #333;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .child {
      display: none;
      font-size: 24px;
      font-weight: bold;
    }

    .controls {
      margin-top: 20px;
    }

    input {
      width: 50px;
      text-align: center;
    }

    button {
      margin: 0 10px;
      padding: 6px 12px;
    }
  </style>
</head>
<body>

  <!-- Parent Div -->
  <div id="parent">
    <!-- Child Divs -->
    <div class="child">Child Div 1</div>
    <div class="child">Child Div 2</div>
    <div class="child">Child Div 3</div>
    <div class="child">Child Div 4</div>
    <div class="child">Child Div 5</div>
    <div class="child">Child Div 6</div>
    <div class="child">Child Div 7</div>
    <div class="child">Child Div 8</div>
    <div class="child">Child Div 9</div>
    <div class="child">Child Div 10</div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button id="prev">Prev</button>
    <input type="number" id="jumpInput" min="1" max="10" placeholder="1–10">
    <button id="next">Next</button>
  </div>

  <script>
    const children = document.querySelectorAll(".child");
    const prevBtn = document.getElementById("prev");
    const nextBtn = document.getElementById("next");
    const jumpInput = document.getElementById("jumpInput");
  
    let currentIndex = 0;
  
    function showDiv(index) {
      children.forEach((child, i) => {
        child.style.display = i === index ? "block" : "none";
      });
    }
  
    // initial display
    showDiv(currentIndex);
  
    // Prev
    prevBtn.addEventListener("click", () => {
      if (currentIndex <= 0) {
        currentIndex = children.length - 1;
      } else {
        currentIndex--;
      }
      showDiv(currentIndex);
      jumpInput.value = "";
    });
  
    // Next
    nextBtn.addEventListener("click", () => {
      if (currentIndex >= children.length - 1) {
        currentIndex = 0;
      } else {
        currentIndex++;
      }
      showDiv(currentIndex);
      jumpInput.value = "";
    });
  
    // Jump input
    jumpInput.addEventListener("change", () => {
      const val = parseInt(jumpInput.value);
      if (!isNaN(val) && val >= 1 && val <= children.length) {
        currentIndex = val - 1;
        showDiv(currentIndex);
      } else {
        alert("Please enter a valid number between 1 and 10");
      }
    });
  </script>
  

</body>
</html>
