<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Candidate Registration | RozgarSathi</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 20px;
  }

  form {
    max-width: 800px;
    background: #ffffff;
    padding: 25px;
    margin: auto;
    border-radius: 10px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.1);
  }

  h3 {
    margin-top: 30px;
    color: #1e3a8a;
    border-left: 5px solid #2563eb;
    padding-left: 10px;
  }

  label {
    display: block;
    margin-top: 15px;
    font-weight: 600;
  }

  input, select {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 14px;
  }

  input:focus, select:focus {
    outline: none;
    border-color: #2563eb;
  }

  hr {
    margin: 30px 0;
    border: none;
    border-top: 1px solid #ddd;
  }

  button {
    background: #2563eb;
    color: #fff;
    border: none;
    padding: 14px;
    font-size: 16px;
    border-radius: 6px;
    cursor: pointer;
    width: 100%;
  }

  button:hover {
    background: #1e40af;
  }

  .checkbox {
    margin-top: 10px;
  }

  .hidden {
    display: none;
  }

  @media (max-width: 600px) {
    form {
      padding: 15px;
    }
  }
</style>
</head>

<body>

<form id="candidateForm">

  <!-- PERSONAL DETAILS -->
  <h3>Personal Details</h3>

  <label>Full Name *</label>
  <input type="text" name="full_name" required>

  <label>Mobile Number *</label>
  <input type="tel" name="mobile" pattern="[0-9]{10}" required>

  <label>Email Address *</label>
  <input type="email" name="email" required>

  <label>Date of Birth *</label>
  <input type="date" name="dob" required>

  <label>Gender *</label>
  <select name="gender" required>
    <option value="">Select</option>
    <option>Male</option>
    <option>Female</option>
    <option>Other</option>
  </select>

  <label>Current City *</label>
  <input type="text" name="city" required>

  <label>State *</label>
  <input type="text" name="state" required>

  <label>Willing to Relocate?</label>
  <select name="relocate">
    <option>No</option>
    <option>Yes</option>
  </select>

  <hr>

  <!-- EDUCATION -->
  <h3>Education Details</h3>

  <label>Highest Qualification *</label>
  <select name="qualification" required>
    <option value="">Select</option>
    <option>10th</option>
    <option>12th</option>
    <option>Diploma</option>
    <option>ITI</option>
    <option>Graduate</option>
    <option>Post Graduate</option>
  </select>

  <label>Course / Stream</label>
  <input type="text" name="course">

  <label>Institute / University</label>
  <input type="text" name="institute">

  <label>Year of Passing</label>
  <input type="number" min="1990" max="2035">

  <hr>

  <!-- EXPERIENCE -->
  <h3>Experience & Skills</h3>

  <label>Experience Level *</label>
  <select id="experienceLevel" required>
    <option value="Fresher">Fresher</option>
    <option value="Experienced">Experienced</option>
  </select>

  <div id="experienceFields" class="hidden">
    <label>Total Experience (Years)</label>
    <input type="number" step="0.5">

    <label>Current / Last Job Title</label>
    <input type="text">

    <label>Industry</label>
    <input type="text">
  </div>

  <label>Primary Skill *</label>
  <input type="text" required>

  <label>Secondary Skills</label>
  <input type="text" placeholder="Comma separated">

  <hr>

  <!-- JOB PREFERENCES -->
  <h3>Job Preferences</h3>

  <label>Job Role Looking For *</label>
  <input type="text" required>

  <label>Preferred Job Location *</label>
  <input type="text" required>

  <label>Job Type *</label>
  <select required>
    <option>Full-time</option>
    <option>Part-time</option>
    <option>Internship</option>
    <option>Contract</option>
  </select>

  <label>Preferred Shift *</label>
  <select required>
    <option>Day</option>
    <option>Night</option>
    <option>Rotational</option>
  </select>

  <label>Immediate Joiner?</label>
  <select>
    <option>No</option>
    <option>Yes</option>
  </select>

  <hr>

  <!-- SALARY -->
  <h3>Salary Details</h3>

  <label>Current Salary (Monthly)</label>
  <input type="number">

  <label>Expected Salary Range *</label>
  <input type="text" placeholder="e.g. 15,000 - 25,000" required>

  <label>Negotiable?</label>
  <select>
    <option>Yes</option>
    <option>No</option>
  </select>

  <hr>

  <!-- RESUME -->
  <h3>Resume (Optional)</h3>

  <label>Upload Resume</label>
  <input type="file" accept=".pdf,.doc,.docx">

  <label>LinkedIn / Portfolio URL</label>
  <input type="url">

  <hr>

  <!-- CONSENT -->
  <h3>Consent</h3>
  <label class="checkbox">
    <input type="checkbox" required>
    I agree to the Terms & Conditions and Privacy Policy *
  </label>

  <br>

  <button type="submit">Register</button>

</form>

<script>
  const experienceLevel = document.getElementById("experienceLevel");
  const experienceFields = document.getElementById("experienceFields");

  experienceLevel.addEventListener("change", function () {
    if (this.value === "Experienced") {
      experienceFields.classList.remove("hidden");
    } else {
      experienceFields.classList.add("hidden");
    }
  });

  document.getElementById("candidateForm").addEventListener("submit", function(e) {
    e.preventDefault();
    alert("Registration Successful! Our team will contact you soon.");
    this.reset();
    experienceFields.classList.add("hidden");
  });
</script>

</body>
</html>
